<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Boxmodel</title>
    <style>
        *{
            padding:0px;
            margin:0;
        }
        .box{
            background-color: maroon;
        }
        .box1{
            padding:10px;
            color:blueviolet;
            margin: 35px;
            border: 5px solid blue;
            height: 200px;
            box-sizing: border-box;
        }
        .box2{
            background-color: chocolate;
        } 
    </style>
</head>
<body>
    <div class="box box1">this is a box</div>
    <div class="box box2">this is second box</div>
</body>
</html>
