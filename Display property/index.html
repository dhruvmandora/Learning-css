<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        .box {
            border: 2px solid blue;
            display: inline-block;
            width: 200px;
            padding: 45px;
            margin: 30px;
        }
        .box1{
            /* display: none; */
            visibility: hidden;
        }
    </style>
</head>

<body>
    <div class="box box1">
        I am a box
    </div>
    <div class="box">
        also a nice box
    </div>
    <span>
        I am a good
    </span>
    <span>
        box
    </span>
    <!-- <div>
        you too !!!!! 
    </div> -->
</body>

</html>
