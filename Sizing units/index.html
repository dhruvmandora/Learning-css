<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sizing units</title>
    <style>
        /* *{
            margin: 0;
            padding: 0;
        } */
        .box{
            box-sizing: border-box;
            width: 300px;
            border: solid 3px black;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>this is a box inside the paragraph</p>
    </div>

    <p>
        hey kaaku
        <br>
        <br>
        good night
    </p>
</body>
</html>
